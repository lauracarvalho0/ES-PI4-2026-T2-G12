<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroMonitor - Cadastrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <div class="login-wrapper">

    <aside class="login-left">
    <a href="/index.html" class="login-logo">AgroMonitor</a>

      <div class="login-left-content">
        <h1 class="login-headline">
          Plante hoje,<br>
          colha melhores<br>
          decisões amanhã!
        </h1>
        <p class="login-left-text">
          Registre, acompanhe e analise todo o ciclo
          de sua plantação com dados inteligentes
          e insights personalizados
        </p>
      </div>

    </aside>

    <main class="login-right">
      <nav class="login-nav">
       <a href="login.html" class="btn btn-solid">Entrar</a>
        <a href="cadastro.html" class="btn btn-outline">Cadastrar</a>
      </nav>

      <div class="login-form-container">
        <h2 class="login-title">Crie sua conta!</h2>
        <p class="login-subtitle">Cadastre-se para começar a acompanhar o seu plantio</p>

        <form class="login-form">
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o seu nome completo">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o seu Email">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" placeholder="Digite o seu Email">
            </div>

            <div class="form-group">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" placeholder="Digite o seu telefone">
            </div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="password-field">
              <input type="password" id="senha" name="senha" placeholder="Digite a sua senha">
              <button type="button" class="toggle-password" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmar-senha">Confirme sua senha</label>
            <div class="password-field">
              <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a sua senha">
              <button type="button" class="toggle-password" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">Cadastrar</button>

          <a href="login.html" class="login-alt-action">Já possui uma conta?</a>
        </form>
      </div>
    </main>

  </div>

  <script src="/js/auth.js"></script>

</body>
</html>
