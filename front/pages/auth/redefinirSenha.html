<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- o token vai na URL: nao deixa o navegador repassa-lo em links externos -->
<meta name="referrer" content="no-referrer">
<title>AgroMonitor - Nova Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/png" href="../../assets/images/icon.png">
</head>
<body>

  <div class="login-wrapper">

    <aside class="login-left">
      <a href="/index.html" class="login-logo">AgroMonitor</a>

      <div class="login-left-content">
        <h1 class="login-headline">
          Plante hoje,<br>
          colha melhores<br>
          decisões amanhã!
        </h1>
        <p class="login-left-text">
          Registre, acompanhe e analise todo o ciclo
          de sua plantação com dados inteligentes
          e insights personalizados
        </p>
      </div>

    </aside>

    <main class="login-right">
      <nav class="login-nav">
        <a href="login.html" class="btn btn-solid">Entrar</a>
        <a href="cadastro.html" class="btn btn-outline">Cadastrar</a>
      </nav>

      <div class="login-form-container">
        <!-- MUDANCA: textos ajustados (antes repetiam os da tela de e-mail) -->
        <h2 class="login-title">Crie uma nova senha!</h2>
        <p class="login-subtitle">Digite e confirme a sua nova senha</p>

        <!-- MUDANCA: id="form-redefinir" -->
        <form class="login-form" id="form-redefinir">
          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="password-field">
              <input type="password" id="senha" name="senha" placeholder="Digite a sua nova senha">
              <button type="button" class="toggle-password" aria-label="Mostrar senha">
                <!--Icone de olho-->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmar-senha">Confirme a sua senha</label>
            <div class="password-field">
              <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a sua nova senha">
              <button type="button" class="toggle-password" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">Recuperar Senha</button>
        </form>
      </div>
    </main>

  </div>

  <script src="/js/auth.js"></script>

</body>
</html>
