<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroMonitor - Recuperar Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/png" href="../../assets/images/icon.png">
</head>
<body>

  <div class="login-wrapper">

    <aside class="login-left">
      <a href="/index.html" class="login-logo">AgroMonitor</a>

      <div class="login-left-content">
        <h1 class="login-headline">
          Plante hoje,<br>
          colha melhores<br>
          decisões amanhã!
        </h1>
        <p class="login-left-text">
          Registre, acompanhe e analise todo o ciclo
          de sua plantação com dados inteligentes
          e insights personalizados
        </p>
      </div>

    </aside>

    <main class="login-right">
      <nav class="login-nav">
        <a href="login.html" class="btn btn-solid">Entrar</a>
        <a href="cadastro.html" class="btn btn-outline">Cadastrar</a>
      </nav>

      <div class="login-form-container">
        <h2 class="login-title">Recupere a sua senha!</h2>
        <p class="login-subtitle">Insira o seu e-mail e clique no link de recuperação</p>

        <!-- MUDANCA: id="form-recuperar" -->
        <form class="login-form" id="form-recuperar">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite o seu email">
          </div>

          <button type="submit" class="btn-submit">Enviar Link de Recuperação</button>

          <!-- MUDANCA: id="btn-reenviar"; fica desativado ate o primeiro envio e depois espera 60 s -->
          <button type="button" class="resend-link" id="btn-reenviar" disabled>Reenviar link</button>
        </form>
      </div>
    </main>

  </div>

  <!-- MUDANCA: faltava o script nesta pagina -->
  <script src="/js/auth.js"></script>

</body>
</html>
